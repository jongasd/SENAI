<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clínica de Fisioterapia - Pacientes</title>
  </head>
  <body>
    <h1>Pacientes</h1>
    <p><a href="/principal">Voltar</a></p>
    <form method="GET" action="/pacientes">
      <input
        type="text"
        name="busca"
        placeholder="Buscar por nome..."
        value="{{busca}}"
      />
      <button>Buscar</button>
    </form>
    <table border="1">
      <tr>
        <th>Nome</th>
        <th>CPF</th>
        <th>Telefone</th>
        <th>E-mail</th>
        <th>Data de Nascimento</th>
        <th>Ações</th>
      </tr>
      {{#pacientes}}
      <tr>
        <td>{{nome}}</td>
        <td>{{cpf}}</td>
        <td>{{telefone}}</td>
        <td>{{email}}</td>
        <td>{{data_nascimento}}</td>
        <td>
          <a href="/pacientes?editar={{id}}">Editar</a>
          <form method="POST" action="/pacientes/{{id}}">
            <input type="hidden" name="_method" value="DELETE" />
            <button>Excluir</button>
          </form>
        </td>
      </tr>
      {{/pacientes}}
    </table>
    <h2>
      {{#editando}}Editar{{/editando}}{{^editando}}Cadastrar{{/editando}}
      paciente
    </h2>
    <form method="POST" action="{{acao}}">
      {{#editando}}<input type="hidden" name="_method" value="PUT" />
      {{/editando}}
      <input
        type="text"
        name="nome"
        placeholder="Nome"
        value="{{form.nome}}"
        required
      />
      <input
        type="text"
        name="cpf"
        placeholder="CPF"
        value="{{form.cpf}}"
        required
      />
      <input
        type="text"
        name="telefone"
        placeholder="Telefone"
        value="{{form.telefone}}"
        required
      />
      <input
        type="email"
        name="email"
        placeholder="E-mail"
        value="{{form.email}}"
        required
      />
      <input
        type="date"
        name="data_nascimento"
        value="{{form.data_nascimento}}"
      />
      <button>
        {{#editando}}Salvar{{/editando}}{{^editando}}Cadastrar{{/editando}}
      </button>
    </form>
    <p>{{erro}}</p>
  </body>
</html>
